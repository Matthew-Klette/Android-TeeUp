name: Android CI

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        # ubuntu-latest runners already ship with an Android SDK at $ANDROID_HOME;
        # android-actions/setup-android@v3 tries to install the long-removed
        # legacy "tools" package and fails outright, so we use the preinstalled
        # SDK directly and just accept licenses for whatever AGP needs to fetch.
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Unit test
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        # Transient GitHub artifact-storage 403 shouldn't fail the job (actions/upload-artifact#560)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests
