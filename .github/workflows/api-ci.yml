name: API CI

on:
  # Every push and pull request, on any branch (POE brief: automated build + unit tests on every remote push).
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test reports
        if: always()
        # Transient GitHub artifact-storage 403 shouldn't fail the job (actions/upload-artifact#560)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: api/**/TestResults/**/*.trx
